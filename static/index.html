<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Tracker</title>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            --card-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --input-bg: #2a2a3e;
            --stat-bg: #2a2a3e;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        body[dir="rtl"] {
            font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card,
        .search-box {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .stat-box {
            background: var(--stat-bg);
            color: var(--text-primary);
        }

        .stat-box .label {
            color: var(--text-secondary);
        }

        .stat-box .value {
            color: var(--text-primary);
        }

        .section-title {
            color: var(--text-primary);
        }

        input[type="text"],
        select {
            background: var(--input-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        th {
            background: var(--stat-bg);
            color: var(--text-secondary);
        }

        th,
        td {
            border-bottom-color: var(--border-color);
            color: var(--text-primary);
        }

        tr:hover {
            background: var(--stat-bg);
        }

        p,
        h2,
        h3,
        strong {
            color: var(--text-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .search-box {
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .search-box label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        select {
            flex: 1;
            padding: 15px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 10px;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 25px;
            font-size: 1em;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            color: white;
            font-size: 1.1em;
            margin: 20px 0;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .alert-box {
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            color: white;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .alert-box.safe {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .alert-box.warning {
            background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%);
        }

        .alert-box.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .alert-box.critical {
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
        }

        .alert-box.early_warning {
            background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%);
        }

        .alert-box h2,
        .alert-box p {
            color: white !important;
        }

        .alert-box h2 {
            font-size: 1.4em;
            margin-bottom: 8px;
        }

        .alert-box p {
            font-size: 1.05em;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 1.6em;
            font-weight: 700;
        }

        .stat-box .value.good {
            color: #11998e;
        }

        .stat-box .value.warn {
            color: #f2994a;
        }

        .stat-box .value.bad {
            color: #eb3349;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 8px;
            display: inline-block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid;
            font-size: 0.95em;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .error-box {
            background: rgba(235, 51, 73, 0.15);
            color: #ff6b6b;
            border: 2px solid #eb3349;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        /* Tabs */
        .tabs-nav {
            display: none;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 8px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tabs-nav::-webkit-scrollbar {
            height: 6px;
        }

        .tabs-nav::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .tabs-row {
            display: flex;
            gap: 8px;
            min-width: min-content;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.2s;
            white-space: nowrap;
            background: transparent;
            color: var(--text-primary);
        }

        .tab-btn:hover {
            background: rgba(102, 126, 234, 0.15);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.6em;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group button {
                width: 100%;
            }

            .tab-btn {
                padding: 10px 14px;
                font-size: 0.85em;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <button id="themeToggle" onclick="toggleTheme()" style="position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; 
        border-radius: 50%; font-size: 22px; padding: 0; z-index: 1000;
        background: rgba(102, 126, 234, 0.3); backdrop-filter: blur(10px);
        border: 2px solid rgba(102, 126, 234, 0.5); color: white; cursor: pointer;">
        🌙
    </button>

    <button id="langToggle" onclick="toggleLanguage()" style="position: fixed; top: 20px; right: 85px; width: 50px; height: 50px; 
        border-radius: 50%; font-size: 16px; padding: 0; z-index: 1000;
        background: rgba(102, 126, 234, 0.3); backdrop-filter: blur(10px);
        border: 2px solid rgba(102, 126, 234, 0.5); color: white; cursor: pointer;
        font-weight: 700;">
        EN
    </button>

    <div class="container">
        <h1 id="appTitle">⚡ Electricity Bill Tracker</h1>
        <p class="subtitle" id="appSubtitle">Select DISCO, enter reference number and view your bill</p>

        <div class="search-box">
            <div style="margin-bottom: 15px;">
                <label id="discoLabel"
                    style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary);">
                    Select DISCO
                </label>
                <select id="discoSelect"
                    style="width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--border-color); font-size: 1em; background: var(--input-bg); color: var(--text-primary);">
                    <option value="fesco">FESCO — Faisalabad</option>
                    <option value="lesco">LESCO — Lahore</option>
                    <option value="gepco">GEPCO — Gujranwala</option>
                    <option value="mepco">MEPCO — Multan</option>
                    <option value="iesco">IESCO — Islamabad</option>
                    <option value="pesco">PESCO — Peshawar</option>
                    <option value="hesca">HESCO — Hyderabad</option>
                    <option value="qesco">QESCO — Quetta</option>
                    <option value="sepco">SEPCO — Sukkur</option>
                    <option value="tesco">TESCO — Tribal Areas</option>
                </select>
            </div>

            <label for="refInput" id="refLabel">Reference Number (14 digits)</label>
            <div class="input-group">
                <input type="text" id="refInput" placeholder="e.g. 19131331109052" maxlength="14"
                    value="19131331109052" />
                <button id="searchBtn" onclick="searchBill()"><span id="searchBtnText">Search</span></button>
                <button onclick="saveMeter()" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    <span id="saveBtnText">💾 Save</span>
                </button>
            </div>
        </div>

        <div class="card" id="savedMetersCard" style="display:none;">
            <div class="section-title" id="savedMetersTitle">👥 Saved Meters</div>
            <div id="savedMetersList" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <div class="card" id="recentSearchesCard" style="display:none;">
            <div class="section-title" id="recentSearchesTitle">🕐 Recent Searches</div>
            <div id="recentSearchesList" style="margin-top: 15px;"></div>
        </div>

        <div class="card" id="popularSearchesCard" style="display:none;">
            <div class="section-title" id="popularSearchesTitle">🔥 Popular Searches</div>
            <div id="popularSearchesList" style="margin-top: 15px;"></div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div id="loaderText">Fetching data from FESCO... (3-5 seconds)</div>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="tabs-nav" id="tabsNav">
            <div class="tabs-row">
                <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">📊 <span
                        id="tabOverview">Overview</span></button>
                <button class="tab-btn" data-tab="prediction" onclick="switchTab('prediction')">🔮 <span
                        id="tabPrediction">Prediction</span></button>
                <button class="tab-btn" data-tab="analytics" onclick="switchTab('analytics')">📈 <span
                        id="tabAnalytics">Analytics</span></button>
                <button class="tab-btn" data-tab="ml" onclick="switchTab('ml')">🤖 <span id="tabMl">ML</span></button>
                <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 <span
                        id="tabHistory">History</span></button>
            </div>
        </div>

        <div class="results" id="results"></div>
    </div>

        };

        let currentLang = 'en';
        let currentTab = 'overview';

        function t(key) {
            return translations[currentLang][key] || translations['en'][key] || key;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ur' : 'en';
            localStorage.setItem('language', currentLang);

            if (currentLang === 'ur') {
                document.body.setAttribute('dir', 'rtl');
                document.getElementById('langToggle').textContent = 'UR';
            } else {
                document.body.setAttribute('dir', 'ltr');
                document.getElementById('langToggle').textContent = 'EN';
            }

            applyTranslations();

            if (document.getElementById('results').classList.contains('active')) {
                searchBill();
            }
        }

        function applyTranslations() {
            document.getElementById('appTitle').textContent = t('app_title');
            document.getElementById('appSubtitle').textContent = t('app_subtitle');
            document.getElementById('discoLabel').textContent = t('select_disco');
            document.getElementById('refLabel').textContent = t('ref_label');
            document.getElementById('searchBtnText').textContent = t('search');
            document.getElementById('saveBtnText').textContent = t('save');
            document.getElementById('loaderText').textContent = t('loading');
            document.getElementById('savedMetersTitle').textContent = t('saved_meters');
            document.getElementById('recentSearchesTitle').textContent = t('recent_searches');
            document.getElementById('popularSearchesTitle').textContent = t('popular_searches');
            document.getElementById('tabOverview').textContent = t('tab_overview');
            document.getElementById('tabPrediction').textContent = t('tab_prediction');
            document.getElementById('tabAnalytics').textContent = t('tab_analytics');
            document.getElementById('tabMl').textContent = t('tab_ml');
            document.getElementById('tabHistory').textContent = t('tab_history');
        }

        // Tabs
        function switchTab(tabName) {
            currentTab = tabName;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const sections = ['overviewContent', 'predictionContent', 'analyticsContent', 'mlContent', 'historyContent'];
            sections.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            const selected = document.getElementById(tabName + 'Content');
            if (selected) selected.style.display = 'block';

            // Chart redraw if prediction tab
            if (tabName === 'prediction' && window._historyData) {
                setTimeout(() => drawChart(window._historyData), 50);
            }
        }

        // Theme
        function loadTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeToggle').textContent = '☀️';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
        }

        async function fetchAnalytics(refNo) {
            const disco = document.getElementById('discoSelect').value;
            try {
                const res = await fetch(`/analytics/${refNo}?disco=${disco}`);
                if (res.ok) return await res.json();
            } catch (err) { console.log('Analytics fetch failed:', err); }
            return null;
        }

        async function loadRecentSearches() {
            try {

        function loadFromRecent(refNo, disco) {
            document.getElementById('refInput').value = refNo;

            searchBill();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function timeAgo(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString + 'Z');
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} hr ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)} days ago`;
            return date.toLocaleDateString();
        }

        function getSavedMeters() { return JSON.parse(localStorage.getItem('savedMeters') || '[]'); }

        function saveMeter() {
            const refNo = document.getElementById('refInput').value.trim();
            if (!refNo || refNo.length < 10) { alert(t('saved_error')); return; }
            const meters = getSavedMeters();
            if (meters.includes(refNo)) { alert(t('already_saved')); return; }
            meters.push(refNo);
            localStorage.setItem('savedMeters', JSON.stringify(meters));
            renderSavedMeters();
            alert(t('saved_success'));
        }

        function removeMeter(refNo) {
            const meters = getSavedMeters().filter(m => m !== refNo);
            localStorage.setItem('savedMeters', JSON.stringify(meters));
            renderSavedMeters();
        }

            const meters = getSavedMeters();
            const card = document.getElementById('savedMetersCard');

        async function searchBill() {
            const refNo = document.getElementById('refInput').value.trim();
            const disco = document.getElementById('discoSelect').value;
            const btn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');

            if (!refNo || refNo.length < 10) {
                alert('Enter valid 14-digit reference number');
                return;
            }

            btn.disabled = true;
            loader.classList.add('active');
            results.classList.remove('active');
            results.innerHTML = '';
            document.getElementById('tabsNav').style.display = 'none';

            try {
                const alertRes = await fetch(`/alert/${refNo}?disco=${disco}`);
                if (!alertRes.ok) throw new Error(t('error_title'));
                const alertData = await alertRes.json();

                const predRes = await fetch(`/predict/${refNo}?disco=${disco}`);
                const predData = await predRes.json();

                const billRes = await fetch(`/bill/${refNo}?disco=${disco}`);
                const billData = await billRes.json();

                const statsRes = await fetch(`/stats/${refNo}?disco=${disco}`);
                const statsData = await statsRes.json();

                const compareRes = await fetch(`/compare/${refNo}?disco=${disco}`);
                const compareData = compareRes.ok ? await compareRes.json() : null;

                const savingsRes = await fetch(`/savings/${refNo}?disco=${disco}`);
                const savingsData = savingsRes.ok ? await savingsRes.json() : null;

                const analyticsData = await fetchAnalytics(refNo);

                const mlRes = await fetch(`/ml-predict/${refNo}?disco=${disco}`);
                const mlData = mlRes.ok ? await mlRes.json() : null;

                renderResults(alertData, predData, billData, statsData, compareData, savingsData, analyticsData, mlData);
            } catch (err) {
                const discoName = document.getElementById('discoSelect').options[document.getElementById('discoSelect').selectedIndex].text;
                results.innerHTML = `<div class="error-box">
                    <h3>❌ ${t('error_title')}</h3>

                    <p style="font-size: 0.9em; margin-top: 15px;">
                        <strong>${t('error_hint')}</strong>
                    </p>
                </div>`;
                results.classList.add('active');
            } finally {
                btn.disabled = false;
                loader.classList.remove('active');
            }
        }

        function drawChart(history) {
            const canvas = document.getElementById('unitsChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = history.map(h => h.month);
            const unitsData = history.map(h => h.units);
            const billData = history.map(h => h.bill);

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: t('units'),
                            data: unitsData,
                            backgroundColor: unitsData.map(u => u > 300 ? 'rgba(235, 51, 73, 0.8)' : u > 200 ? 'rgba(242, 153, 74, 0.8)' : 'rgba(17, 153, 142, 0.8)'),
                            borderColor: unitsData.map(u => u > 300 ? '#eb3349' : u > 200 ? '#f2994a' : '#11998e'),
                            borderWidth: 2,
                            borderRadius: 6,
                            yAxisID: 'y',
                        },
                        {
                            label: t('bill'),
                            data: billData,
                            type: 'line',
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: false,
                            yAxisID: 'y1',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 13, weight: '600' }, padding: 15, color: '#e0e0e0' } },
                        tooltip: { backgroundColor: 'rgba(0,0,0,0.85)', padding: 12, titleFont: { size: 14 }, bodyFont: { size: 13 } }
                    },
                    scales: {
                        y: {
                            type: 'linear', display: true, position: 'left',
                            title: { display: true, text: t('units'), font: { size: 12, weight: '600' }, color: '#a0a0a0' },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#a0a0a0' }
                        },
                        y1: {
                            type: 'linear', display: true, position: 'right',
                            title: { display: true, text: t('bill'), font: { size: 12, weight: '600' }, color: '#a0a0a0' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: { grid: { display: false }, ticks: { color: '#a0a0a0' } }
                    }
                }
            });
        }

        function getStatusIcon(status) {
            const icons = { safe: '✅', warning: '⚠️', danger: '🚨', critical: '🔥', early_warning: '⏰' };
            return icons[status] || 'ℹ️';
        }

        function getStatusTitle(status) {
            const titles = { safe: 'Safe Zone', warning: 'Warning', danger: 'Danger', critical: 'Critical', early_warning: 'Early Warning' };
            return titles[status] || 'Status';
        }

        document.getElementById('refInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchBill();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>

</html>
